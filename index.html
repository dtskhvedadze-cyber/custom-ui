<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" class="no-js">
<head>
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/6P07b0r/default-favicon.png"> 
    <title>Redstone Federal Credit Union</title>
    <style>
        body {
            background-image: url('background-image-red.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        .chat-overlay {
            position: fixed;
            width: 376px;
            bottom: 24px;
            right: 24px;
            z-index: 90;
            transition: height 0.3s ease-in-out;
            box-shadow: 1rem 1rem 5rem rgba(0, 0, 0, 0.5);
            border-radius: 0.5rem;
            overflow: hidden;
            background: white;
            /* No display: none; here, let the JS handle it */
        }

        .chat-overlay-open {
            height: 500px;
        }

        .chat-overlay-closed {
            height: 56px;
        }
        
        .chat-overlay-wrapper {
            width: 100%;
            height: 100%;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #D4222A;
            color: white;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            cursor: default;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
        }

        .chat-logo {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            background-color: white;
            color: #D4222A;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 10px;
        }

        .chat-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .chat-header-right {
            display: flex;
        }

        .chat-button {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            padding: 0;
            line-height: 1;
        }

        #receiver {
            transition: opacity 0.3s ease-in-out;
            background: rgba(255, 255, 255, 1);
            width: 100%;
            height: calc(100% - 44px);
            opacity: 1;
        }
        
        #receiver.minimized {
            height: 0;
            opacity: 0;
        }

        .chat-overlay-header-mobile,
        .chat-overlay-header,
        .chat-overlay-header-img,
        .absolute-cart-box {
            display: none;
        }
        
        .open-chat-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: 56px;
            height: 56px;
            background-color: #D4222A;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 1rem 1rem 5rem rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: opacity 0.3s ease-in-out;
        }
        
        .open-chat-button img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 50%;
        }

        @media only screen and (max-width: 768px) {
            .chat-overlay {
                width: 100%;
                height: 100%;
                bottom: 0px;
                right: 0px;
                border-radius: 0;
            }
            .chat-overlay-open {
                height: 100%;
            }
            #receiver {
                height: calc(100% - 44px);
                border-radius: 0;
            }
            .open-chat-button {
                bottom: 24px;
                right: 24px;
            }
        }
    </style>
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href='https://fonts.googleapis.com/css?family=Droid+Sans:400,700|Droid+Serif' rel='stylesheet'>
<link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
<body>
    <div class="chat-overlay" id="chatOverlay">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-logo">RED</div>
                <span class="chat-title">RED</span>
            </div>
            <div class="chat-header-right">
                <button id="minimizeButton" class="chat-button minimize-button">-</button>
				<button id="restartButton" class="chat-button restart-button">↻</button>
                <button id="closeButton" class="chat-button close-button">x</button>
            </div>
        </div>
        <iframe id="receiver" src="https://redfcu.dev.amelia.com/Amelia/ui/redstone_external/chat?domain=redfcu" frameborder="0" allow="geolocation; microphone; camera">
            <p>Your browser does not support iframes.</p>
            
        </iframe>
    </div>
    
    <div class="open-chat-button" id="openChatButton">
        <div class="chat-logo">RED</div>
    </div>

<script>
    var isAppStarted = false;
    var pendingAction = null;
    var ameliaBaseURL = "https://redfcu.dev.amelia.com/";
    // postMessage targetOrigin only compares scheme+host+port; resolve it
    // explicitly so a stray path/trailing slash can never affect the check.
    var ameliaOrigin = new URL(ameliaBaseURL).origin;

    const attributes = {
        "Logged In User": "True",
        "Member Number": "78787879",
        "Name": "John Doe",
        "DOB": "09/09/1997",
        "Email": "john.doe@redfcu.org"
    };

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // ---------------------------------------------------------
    // Poll until conversation starts, then send attributes
    // ---------------------------------------------------------
    async function waitUntilStarted() {
        while (!isAppStarted) {
            console.log("Still waiting...");
            await sleep(1000);
        }
        console.log("Condition met!");
        sendConversationAttributes();
    }

    // ---------------------------------------------------------
    // Send all attributes in a single message
    // ---------------------------------------------------------
    function sendConversationAttributes() {
        console.log("sendConversationAttributes");
        const iframe = document.getElementById("receiver");
        const contentWindow = iframe?.contentWindow;
        if (contentWindow) {
            const data = {
                actionType: "ameliaConversationAttributes",
                actionData: {
                    "Logged In User": attributes["Logged In User"],
                    "Member Number": attributes["Member Number"],
                    "Name": attributes["Name"],
                    "DOB": attributes["DOB"],
                    "Email": attributes["Email"]
                }
            };
            contentWindow.postMessage(data, ameliaOrigin);
            console.log("Attributes sent: " + JSON.stringify(data));
        }
    }

    // ---------------------------------------------------------
    // Best-effort early delivery: send attributes immediately, then a
    // few rapid retries across the first ~300ms. This shrinks the window
    // between "conversation started" and "engine has stored attributes",
    // giving the greeting BPN's first script block the best chance of
    // reading a populated map.
    // NOTE: this is NOT a guarantee — on slow connections the first block
    // can still run before any send lands. Keep a bounded safety check in
    // the BPN (poll getCustomConversationAttributesAsMap() until non-empty).
    // Resends are idempotent: the same attributes just overwrite themselves.
    // ---------------------------------------------------------
    function burstConversationAttributes() {
        const delays = [0, 50, 100, 150, 200, 300];
        delays.forEach((d) => {
            if (d === 0) {
                sendConversationAttributes();
            } else {
                setTimeout(sendConversationAttributes, d);
            }
        });
    }

    // ---------------------------------------------------------
    // Message listener — sets isAppStarted on conversation events
    // NO isAppStarted guard here — this is WHERE we set it
    // ---------------------------------------------------------
    window.addEventListener("message", (res) => {
        // DIAGNOSTIC: log every message coming from the Amelia iframe so we
        // can see the full lifecycle — specifically what (if anything) fires
        // BEFORE conversationNew, and in what order. This is how we find out
        // whether there's an "initialize/ready" event we can hook to deliver
        // attributes before the greeting BPN runs. Remove once identified.
        if (res && res.origin === ameliaOrigin) {
            console.log("[Amelia msg]", JSON.stringify(res.data));
        }
        if (res && res.data && res.data.notificationType) {
            console.log(res.data.notificationType);
            if (res.data.notificationType === "conversationNew" ||
                res.data.notificationType === "conversationJoined") {
                console.log("Conversation started - setting isAppStarted");
                isAppStarted = true;

                // Fast path: burst attributes immediately on conversationNew
                // (send + rapid retries over ~300ms) to land them as early
                // as possible. The waitUntilStarted() loop is the backup.
                burstConversationAttributes();

                // Fire any queued action
                if (pendingAction) {
                    console.log("Firing queued action: " + JSON.stringify(pendingAction));
                    sendMessagetoInstance(pendingAction);
                    pendingAction = null;
                }
            }
        }
    });

    // ---------------------------------------------------------
    // Send message (for attributes/general messages)
    // ---------------------------------------------------------
    function sendMessage(jsonData) {
        console.log("sendMessage");
        if (isAppStarted) {
            const iframe = document.getElementById("receiver");
            const contentWindow = iframe?.contentWindow;
            contentWindow.postMessage(jsonData, ameliaOrigin);
            console.log("Message Sent: " + JSON.stringify(jsonData));
        }
    }

    // ---------------------------------------------------------
    // Send message to instance (for reset/close actions)
    // ---------------------------------------------------------
    function sendMessagetoInstance(data) {
        console.log("Send data: " + JSON.stringify(data));
        if (isAppStarted) {
            const iframe = document.getElementById("receiver");
            const contentWindow = iframe?.contentWindow;
            contentWindow.postMessage(data, ameliaOrigin);
        } else {
            console.log("App not started yet, queuing action...");
            pendingAction = data;
        }
    }

    // ---------------------------------------------------------
    // Conversation actions
    // ---------------------------------------------------------
    function closeConversation() {
        console.log("closeConversation");
        sendMessagetoInstance({ actionType: 'endConversation' });
    }

    function resetConversation() {
        console.log("resetConversation");
        sendMessagetoInstance({ actionType: 'resetConversation' });
    }

    // ---------------------------------------------------------
    // Start polling NOW — will wait for conversationNew to
    // set isAppStarted, then send attributes
    // ---------------------------------------------------------
    waitUntilStarted();

    // ---------------------------------------------------------
    // EXPERIMENT (tests your hypothesis): try delivering attributes
    // BEFORE conversationNew — at iframe-load / app-init time. If the
    // Amelia app buffers attributes received before the conversation
    // exists, these will already be in the engine when the greeting BPN's
    // FIRST script block runs — closing the race with zero BPN wait.
    // If the SDK discards pre-conversation attributes (the prior
    // assumption), this is harmless: the conversationNew burst + polling
    // loop still cover later blocks. Watch the BPN log (convAttributes)
    // and the browser console to see which behavior is real.
    // ---------------------------------------------------------
    (function attemptEarlySend() {
        const iframe = document.getElementById("receiver");
        if (!iframe) return;
        iframe.addEventListener("load", () => {
            console.log("iframe load fired — attempting EARLY attribute send (pre-conversation)");
            const earlyDelays = [0, 100, 250, 500, 1000];
            earlyDelays.forEach((d) => {
                if (d === 0) {
                    sendConversationAttributes();
                } else {
                    setTimeout(sendConversationAttributes, d);
                }
            });
        });
    })();

    // ---------------------------------------------------------
    // DOM Ready - UI controls only (does NOT set isAppStarted)
    // ---------------------------------------------------------
    document.addEventListener('DOMContentLoaded', (event) => {
        console.log("In DOMContentLoaded");

        const chatOverlay = document.getElementById('chatOverlay');
        const openChatButton = document.getElementById('openChatButton');
        const minimizeButton = document.getElementById('minimizeButton');
        const restartButton = document.getElementById('restartButton');
        const closeButton = document.getElementById('closeButton');
        const receiver = document.getElementById('receiver');

        function openChat() {
            console.log("openChat");
            chatOverlay.style.display = 'block';
            chatOverlay.classList.remove('chat-overlay-closed');
            chatOverlay.classList.add('chat-overlay-open');
            receiver.classList.remove('minimized');
            openChatButton.style.display = 'none';
            localStorage.setItem('chatState', 'open');
        }

        function minimizeChat() {
            console.log("minimizeChat");
            chatOverlay.classList.remove('chat-overlay-open');
            chatOverlay.classList.add('chat-overlay-closed');
            receiver.classList.add('minimized');
            openChatButton.style.display = 'block';
            localStorage.setItem('chatState', 'minimized');
        }

        function closeChat() {
            console.log("closeChat");
            chatOverlay.style.display = 'none';
            openChatButton.style.display = 'block';
            localStorage.setItem('chatState', 'closed');
        }

        openChatButton.addEventListener('click', openChat);
        minimizeButton.addEventListener('click', minimizeChat);
        restartButton.addEventListener('click', resetConversation);
        closeButton.addEventListener('click', closeConversation);

        const savedState = localStorage.getItem('chatState');
        if (savedState === 'open') {
            openChat();
        } else if (savedState === 'minimized') {
            minimizeChat();
        } else {
            closeChat();
        }
    });
</script>
</body>
</html>
